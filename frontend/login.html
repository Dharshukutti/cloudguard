<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CloudGuard - Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root{ --bg-primary:#0a0e1a; --bg-glass:rgba(17,24,39,0.6); --text-primary:#f1f5f9; --border-glass:rgba(255,255,255,0.08); --accent-cyan:#06b6d4; }
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);font-family:Inter,Segoe UI,Roboto,Arial;color:var(--text-primary)}
    .login-card{width:420px;background:var(--bg-glass);padding:28px;border-radius:12px;border:1px solid var(--border-glass);box-shadow:0 10px 32px rgba(0,0,0,0.6)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .brand-icon{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center}
    h2{margin:0 0 8px 0}
    label{display:block;font-size:13px;color:var(--text-primary);margin-top:10px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border-glass);background:transparent;color:var(--text-primary);margin-top:6px}
    .btn{margin-top:14px;padding:10px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;font-weight:700;cursor:pointer}
    .error{color:#ffb4b4;margin-top:10px;font-size:13px}
    .links{margin-top:8px;font-size:12px;color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-shield-alt" style="color:white"></i></div>
      <div>
        <div style="font-weight:700">CloudGuard</div>
        <div style="font-size:12px;color:#94a3b8">AWS Security Platform</div>
      </div>
    </div>
    <h2>Sign in to CloudGuard</h2>
    <div style="color:#94a3b8;font-size:13px;margin-bottom:8px">Enter your credentials to continue</div>
    <label>Username
      <input id="cg_user" type="text" autocomplete="username" />
    </label>
    <label>Password
      <input id="cg_pass" type="password" autocomplete="current-password" />
    </label>
    <div id="cg_login_error" class="error" style="display:none"></div>
    <button id="cg_login" class="btn">Login</button>
    <div class="links">Demo credentials: <strong>admin</strong> / <strong>admin123</strong></div>
  </div>
  <script>
    const LS = { session: 'cloudguard.session' };
    document.getElementById('cg_login').addEventListener('click', ()=>{
      const u = document.getElementById('cg_user').value.trim();
      const p = document.getElementById('cg_pass').value;
      const err = document.getElementById('cg_login_error');
      if (u==='admin' && p==='admin123'){
        localStorage.setItem(LS.session, JSON.stringify({username:'admin', loggedAt: new Date().toISOString()}));
        location.href = 'templates/cloudguard_dashboard.html';
      } else { err.style.display='block'; err.textContent='Invalid credentials'; }
    });
    document.addEventListener('keydown',(e)=>{ if (e.key==='Enter') document.getElementById('cg_login').click(); });
  </script>
</body>
</html>
