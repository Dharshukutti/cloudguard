<!DOCTYPE html>
<html>

<head>
    <title>CloudGuard Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CloudGuard Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2>Total Users</h2>
            <p id="totalUsers">0</p>
        </div>

        <div class="card">
            <h2>High Risk</h2>
            <p id="highRisk">0</p>
        </div>

        <div class="card">
            <h2>Medium Risk</h2>
            <p id="mediumRisk">0</p>
        </div>

        <div class="card">
            <h2>Low Risk</h2>
            <p id="lowRisk">0</p>
        </div>

    </div>

    <hr>

    <h2>Users</h2>

    <table border="1" id="usersTable">

        <thead>
            <tr>
                <th>User Name</th>
                <th>Risk Score</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>

    <script src="script.js"></script>

</body>

</html>
