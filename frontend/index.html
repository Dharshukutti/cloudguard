<!DOCTYPE html>
<html>

<head>
    <title>CloudGuard Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CloudGuard Dashboard</h1>

    <div class="cards">

        <div class="card total">
            <h2>Total Users</h2>
            <p id="totalUsers">0</p>
        </div>

        <div class="card high">
            <h2>High Risk</h2>
            <p id="highRisk">0</p>
        </div>

        <div class="card medium">
            <h2>Medium Risk</h2>
            <p id="mediumRisk">0</p>
        </div>

        <div class="card low">
            <h2>Low Risk</h2>
            <p id="lowRisk">0</p>
        </div>

    </div>

    <div class="report-section">
        <a href="http://127.0.0.1:5000/api/report" target="_blank">
            <button class="download-btn">
                Download Security Report
            </button>
        </a>
    </div>

    <hr>

    <h2>Risk Distribution</h2>

    <canvas id="riskChart"></canvas>

    <hr>

    <h2>Users</h2>

    <table id="usersTable">

        <thead>
            <tr>
                <th>User Name</th>
                <th>Risk Score</th>
                <th>Status</th>
                <th>Risk Reason</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
