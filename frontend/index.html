<!DOCTYPE html>
<html>
<head>
    <title>CloudGuard Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CloudGuard Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2>Total Users</h2>
            <p id="totalUsers">0</p>
        </div>

        <div class="card">
            <h2>High Risk</h2>
            <p id="highRisk">0</p>
        </div>

        <div class="card">
            <h2>Medium Risk</h2>
            <p id="mediumRisk">0</p>
        </div>

        <div class="card">
            <h2>Low Risk</h2>
            <p id="lowRisk">0</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
